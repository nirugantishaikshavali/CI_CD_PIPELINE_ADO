# ================================================================
# SALESFORCE CI/CD PIPELINE
#
# FLOW:
#
# Developer Feature Branch
#          ↓
#        Pull Request
#          ↓
#     Azure Validation
#          ↓
#     Manager Approval
#          ↓
#        PR Merge
#          ↓
#     Azure Deployment
#          ↓
#       Salesforce
#
#
# BRANCH → SALESFORCE ORG
#
# develop → DEV
# sit     → SIT
# uat     → UAT
# main    → PROD
# ================================================================


# ================================================================
# 1. TRIGGERS
# ================================================================

trigger:
  branches:
    include:
      - develop
      - sit
      - uat
      - main

pr:
  branches:
    include:
      - develop
      - sit
      - uat
      - main


# ================================================================
# 2. VARIABLES
#
# Azure DevOps:
# Pipelines
#   → Library
#   → Variable Groups
#
# Variable Group:
# Salesforce-CICD-Secrets
#
# Required variables:
#
# SF_USERNAME_DEV
# SF_CLIENT_ID_DEV
#
# SF_USERNAME_SIT
# SF_CLIENT_ID_SIT
#
# SF_USERNAME_UAT
# SF_CLIENT_ID_UAT
#
# SF_USERNAME_PROD
# SF_CLIENT_ID_PROD
#
# ================================================================

variables:

  - group: Salesforce-CICD-Secrets

  - name: SGD_VERSION
    value: latest


# ================================================================
# 3. AGENT
# ================================================================

pool:
  vmImage: ubuntu-latest


# ================================================================
# 4. CHECKOUT FULL GIT HISTORY
# ================================================================

steps:

  - checkout: self
    fetchDepth: 0
    clean: true

    displayName: Checkout Full Git History


# ================================================================
# 5. INSTALL NODE.JS
# ================================================================

  - task: UseNode@1
    inputs:
      version: '22.x'

    displayName: Install Node.js


# ================================================================
# 6. INSTALL SALESFORCE CLI
# ================================================================

  - bash: |

      echo "===================================="
      echo "Installing Salesforce CLI"
      echo "===================================="

      npm install --global @salesforce/cli

      echo "===================================="
      echo "Salesforce CLI Version"
      echo "===================================="

      sf --version

    displayName: Install Salesforce CLI


# ================================================================
# 7. INSTALL SFDX-GIT-DELTA
# ================================================================

  - bash: |

      echo "===================================="
      echo "Installing sfdx-git-delta"
      echo "===================================="

      echo y | sf plugins install sfdx-git-delta@$(SGD_VERSION)

      echo "===================================="
      echo "Installed Plugins"
      echo "===================================="

      sf plugins

    displayName: Install sfdx-git-delta


# ================================================================
# 8. DETERMINE TARGET ENVIRONMENT
# ================================================================

  - bash: |

      echo "===================================="
      echo "Branch Information"
      echo "===================================="

      echo "Build.SourceBranch:"
      echo "$(Build.SourceBranch)"

      echo "System.PullRequest.TargetBranch:"
      echo "$(System.PullRequest.TargetBranch)"

      echo "Build.Reason:"
      echo "$(Build.Reason)"


      # ------------------------------------------------------------
      # Determine target branch
      # ------------------------------------------------------------

      if [ "$(Build.Reason)" = "PullRequest" ]; then

        TARGET_BRANCH="$(System.PullRequest.TargetBranch)"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"

      else

        TARGET_BRANCH="$(Build.SourceBranch)"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"

      fi


      echo "Target Branch = $TARGET_BRANCH"


      # ------------------------------------------------------------
      # DEV
      # ------------------------------------------------------------

      if [ "$TARGET_BRANCH" = "develop" ]; then

        echo "Environment = DEV"

        echo "##vso[task.setvariable variable=ENV_NAME]DEV"

        echo "##vso[task.setvariable variable=TEST_LEVEL]NoTestRun"

        echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

        echo "##vso[task.setvariable variable=SF_USERNAME;issecret=true]$(SF_USERNAME_DEV)"

        echo "##vso[task.setvariable variable=SF_CLIENT_ID;issecret=true]$(SF_CLIENT_ID_DEV)"


      # ------------------------------------------------------------
      # SIT
      # ------------------------------------------------------------

      elif [ "$TARGET_BRANCH" = "sit" ]; then

        echo "Environment = SIT"

        echo "##vso[task.setvariable variable=ENV_NAME]SIT"

        echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"

        echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

        echo "##vso[task.setvariable variable=SF_USERNAME;issecret=true]$(SF_USERNAME_SIT)"

        echo "##vso[task.setvariable variable=SF_CLIENT_ID;issecret=true]$(SF_CLIENT_ID_SIT)"


      # ------------------------------------------------------------
      # UAT
      # ------------------------------------------------------------

      elif [ "$TARGET_BRANCH" = "uat" ]; then

        echo "Environment = UAT"

        echo "##vso[task.setvariable variable=ENV_NAME]UAT"

        echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"

        echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

        echo "##vso[task.setvariable variable=SF_USERNAME;issecret=true]$(SF_USERNAME_UAT)"

        echo "##vso[task.setvariable variable=SF_CLIENT_ID;issecret=true]$(SF_CLIENT_ID_UAT)"


      # ------------------------------------------------------------
      # PROD
      # ------------------------------------------------------------

      elif [ "$TARGET_BRANCH" = "main" ]; then

        echo "Environment = PROD"

        echo "##vso[task.setvariable variable=ENV_NAME]PROD"

        echo "##vso[task.setvariable variable=TEST_LEVEL]RunAllTestsInOrg"

        echo "##vso[task.setvariable variable=INSTANCE_URL]https://login.salesforce.com"

        echo "##vso[task.setvariable variable=SF_USERNAME;issecret=true]$(SF_USERNAME_PROD)"

        echo "##vso[task.setvariable variable=SF_CLIENT_ID;issecret=true]$(SF_CLIENT_ID_PROD)"


      else

        echo "ERROR: Unsupported branch: $TARGET_BRANCH"

        exit 1

      fi


      echo "===================================="
      echo "Selected Environment"
      echo "===================================="

      echo "Environment: $(ENV_NAME)"
      echo "Test Level: $(TEST_LEVEL)"
      echo "Instance URL: $(INSTANCE_URL)"

    displayName: Determine Salesforce Environment


# ================================================================
# 9. DOWNLOAD JWT PRIVATE KEY
#
# Azure DevOps:
# Pipelines
#   → Library
#   → Secure files
#
# Secure file:
# server.key
#
# DO NOT COMMIT server.key TO GITHUB.
# ================================================================

  - task: DownloadSecureFile@1
    name: JWT_KEY

    inputs:
      secureFile: 'server.key'

    displayName: Download JWT Private Key


# ================================================================
# 10. PREPARE JWT KEY
# ================================================================

  - bash: |

      echo "===================================="
      echo "Preparing JWT Private Key"
      echo "===================================="

      chmod 600 "$(JWT_KEY.secureFilePath)"

      echo "JWT private key is ready."

      echo "##vso[task.setvariable variable=JWT_KEY_PATH]$(JWT_KEY.secureFilePath)"

    displayName: Prepare JWT Private Key


# ================================================================
# 11. JWT AUTHENTICATION
# ================================================================

  - bash: |

      echo "===================================="
      echo "JWT Authentication"
      echo "===================================="

      echo "Environment: $(ENV_NAME)"

      sf org login jwt \
        --username "$(SF_USERNAME)" \
        --jwt-key-file "$(JWT_KEY_PATH)" \
        --client-id "$(SF_CLIENT_ID)" \
        --instance-url "$(INSTANCE_URL)" \
        --alias target-org \
        --set-default

      echo "===================================="
      echo "Salesforce JWT Login Successful"
      echo "===================================="

    displayName: JWT Authentication


# ================================================================
# 12. VERIFY SALESFORCE CONNECTION
# ================================================================

  - bash: |

      echo "===================================="
      echo "Salesforce Org Information"
      echo "===================================="

      sf org display \
        --target-org target-org


      echo "===================================="
      echo "Authenticated Orgs"
      echo "===================================="

      sf org list

    displayName: Verify Salesforce Authentication


# ================================================================
# 13. DETERMINE DELTA BASELINE
#
# PR:
#
# origin/develop → HEAD
#
# PUSH / MERGE:
#
# First parent → HEAD
#
# This allows a merge commit to represent the changes
# introduced by the PR.
# ================================================================

  - bash: |

      if [ "$(Build.Reason)" = "PullRequest" ]; then

        TARGET_BRANCH="$(System.PullRequest.TargetBranch)"
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"

        echo "PR Target Branch = $TARGET_BRANCH"


        git fetch origin \
          "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"


        echo "##vso[task.setvariable variable=DELTA_FROM]origin/$TARGET_BRANCH"


        echo "===================================="
        echo "Delta Comparison"
        echo "===================================="

        echo "FROM = origin/$TARGET_BRANCH"
        echo "TO   = HEAD"


      else

        echo "Push / Merge build detected."

        # For a merge commit:
        # compare first parent with current commit.

        DELTA_FROM="$(git rev-parse HEAD^1)"

        echo "##vso[task.setvariable variable=DELTA_FROM]$DELTA_FROM"


        echo "===================================="
        echo "Delta Comparison"
        echo "===================================="

        echo "FROM = $DELTA_FROM"
        echo "TO   = HEAD"

      fi

    displayName: Determine Delta Baseline


# ================================================================
# 14. DEBUG GIT DELTA
# ================================================================

  - bash: |

      echo "===================================="
      echo "GIT DEBUG INFORMATION"
      echo "===================================="


      echo "Current commit:"
      git log -1 --oneline


      echo ""
      echo "Recent commits:"
      git log --oneline -10


      echo ""
      echo "Delta FROM:"
      echo "$(DELTA_FROM)"


      echo ""
      echo "Delta TO:"
      echo "HEAD"


      echo ""
      echo "Changed files between FROM and HEAD:"

      git diff --name-status "$(DELTA_FROM)" HEAD


      echo ""
      echo "Changes inside force-app:"

      git diff --name-status "$(DELTA_FROM)" HEAD -- force-app


      echo ""
      echo "Git status:"

      git status

    displayName: Debug Git Delta


# ================================================================
# 15. GENERATE DELTA PACKAGE
# ================================================================

  - bash: |

      echo "===================================="
      echo "Generating Salesforce Delta"
      echo "===================================="


      rm -rf delta

      mkdir -p delta


      sf sgd source delta \
        --from "$(DELTA_FROM)" \
        --to HEAD \
        --output-dir delta \
        --source-dir force-app \
        --generate-delta


      echo "===================================="
      echo "Generated Delta Package"
      echo "===================================="


      if [ -f "delta/package/package.xml" ]; then

        cat delta/package/package.xml

      else

        echo "No package.xml generated."

      fi


      echo "===================================="
      echo "Destructive Changes"
      echo "===================================="


      if [ -f "delta/destructiveChanges/destructiveChanges.xml" ]; then

        cat delta/destructiveChanges/destructiveChanges.xml

      else

        echo "No destructive changes generated."

      fi

    displayName: Generate Delta Package


# ================================================================
# 16. PR VALIDATION
#
# IMPORTANT:
#
# DEV → NoTestRun
#
# We are NOT converting NoTestRun to RunLocalTests.
#
# This allows your current LWC-only POC to validate without
# failing because of unrelated Apex test coverage.
#
# SIT → RunLocalTests
# UAT → RunLocalTests
# PROD → RunAllTestsInOrg
# ================================================================

  - bash: |

      echo "===================================="
      echo "PR VALIDATION"
      echo "===================================="


      if [ -f "delta/package/package.xml" ] && \
         grep -q "<members>" delta/package/package.xml; then


        VALIDATE_TEST_LEVEL="$(TEST_LEVEL)"


        echo "Environment: $(ENV_NAME)"
        echo "Validation Test Level: $VALIDATE_TEST_LEVEL"


        echo "===================================="
        echo "Validating Salesforce Deployment"
        echo "===================================="


        sf project deploy validate \
          --manifest delta/package/package.xml \
          --target-org target-org \
          --test-level "$VALIDATE_TEST_LEVEL" \
          --wait 60


      else

        echo "No Salesforce metadata changes found."

        echo "Skipping validation."

      fi

    condition: eq(variables['Build.Reason'], 'PullRequest')

    displayName: Validate Delta - Pull Request


# ================================================================
# 17. DEPLOY DELTA AFTER MERGE
#
# PR:
#     Validation only
#
# MERGE:
#     Push build
#     Actual deployment
#
# develop → DEV
# sit     → SIT
# uat     → UAT
# main    → PROD
# ================================================================

  - bash: |

      echo "===================================="
      echo "SALESFORCE DEPLOYMENT"
      echo "===================================="


      echo "Environment: $(ENV_NAME)"
      echo "Test Level: $(TEST_LEVEL)"


      if [ -f "delta/package/package.xml" ] && \
         grep -q "<members>" delta/package/package.xml; then


        echo "===================================="
        echo "Deploying Delta Package"
        echo "===================================="


        sf project deploy start \
          --manifest delta/package/package.xml \
          --target-org target-org \
          --test-level "$(TEST_LEVEL)" \
          --wait 60


      else

        echo "No Salesforce metadata changes found."

        echo "Skipping deployment."

      fi

    condition: ne(variables['Build.Reason'], 'PullRequest')

    displayName: Deploy Delta to Salesforce


# ================================================================
# 18. DEPLOY DESTRUCTIVE CHANGES
# ================================================================

  - bash: |

      echo "===================================="
      echo "DESTRUCTIVE CHANGES"
      echo "===================================="


      if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && \
         grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then


        echo "Destructive changes detected."


        cat delta/destructiveChanges/destructiveChanges.xml


        sf project deploy start \
          --manifest delta/destructiveChanges/package.xml \
          --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
          --target-org target-org \
          --test-level NoTestRun \
          --wait 30


      else

        echo "No destructive changes found."

        echo "Skipping destructive deployment."

      fi

    condition: ne(variables['Build.Reason'], 'PullRequest')

    displayName: Deploy Destructive Changes