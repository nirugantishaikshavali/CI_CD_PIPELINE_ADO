# ================================================================
# Salesforce CI/CD Pipeline
#
# Repository : GitHub
# CI/CD      : Azure DevOps
# Authentication : JWT
# Delta Tool : SFDX Git Delta
#
# BRANCH → SALESFORCE ORG
#
# develop → DEV
# SIT     → SIT
# UAT     → UAT
# main    → PROD
#
# FLOW
#
# Feature Branch
#       |
#       v
# Pull Request
#       |
#       v
# PR Validation
#       |
#       +--> JWT Authentication
#       |
#       +--> Generate Delta
#       |
#       +--> Salesforce Validation
#       |
#       +--> Apex Tests
#       |
#       v
# PR Approved
#       |
#       v
# PR MERGED
#       |
#       v
# Actual Deployment
#
# ================================================================


# ================================================================
# CI TRIGGER
#
# Pipeline runs after changes are pushed to these branches.
# ================================================================

trigger:
  branches:
    include:
      - develop
      - SIT
      - UAT
      - main


# ================================================================
# PR TRIGGER
#
# Pipeline runs when a PR targets:
# develop / SIT / UAT / main
#
# Because your repository is GitHub, Azure DevOps supports YAML
# PR triggers for GitHub repositories.
# ================================================================

pr:
  branches:
    include:
      - develop
      - SIT
      - UAT
      - main

  autoCancel: true


# ================================================================
# VARIABLE GROUP
#
# Azure DevOps:
# Library
#   |
#   +-- Variable groups
#          |
#          +-- Salesforce-CICD-Secrets
#
# Contains:
#
# SF_CLIENT_ID_DEV
# SF_CLIENT_ID_SIT
# SF_CLIENT_ID_UAT
# SF_CLIENT_ID_PROD
#
# SF_USERNAME_DEV
# SF_USERNAME_SIT
# SF_USERNAME_UAT
# SF_USERNAME_PROD
# ================================================================

variables:
  - group: Salesforce-CICD-Secrets

  - name: NODE_VERSION
    value: '22.x'

  - name: SF_ALIAS
    value: 'target-org'


# ================================================================
# BUILD AGENT
# ================================================================

pool:
  vmImage: 'ubuntu-latest'


# ================================================================
# JOB
# ================================================================

jobs:

  - job: Salesforce_CICD

    displayName: 'Salesforce CI/CD Pipeline'

    steps:

      # ==========================================================
      # STEP 1
      # CHECKOUT FULL GIT HISTORY
      #
      # SGD needs Git history to compare commits.
      # ==========================================================

      - checkout: self
        fetchDepth: 0

        displayName: 'Checkout Full Git History'


      # ==========================================================
      # STEP 2
      # INSTALL NODE.JS
      # ==========================================================

      - task: NodeTool@0

        displayName: 'Install Node.js'

        inputs:
          versionSpec: '$(NODE_VERSION)'


      # ==========================================================
      # STEP 3
      # INSTALL SALESFORCE CLI
      # ==========================================================

      - bash: |

          npm install --global @salesforce/cli

          echo "Salesforce CLI version:"
          sf --version

        displayName: 'Install Salesforce CLI'


      # ==========================================================
      # STEP 4
      # INSTALL SFDX GIT DELTA
      # ==========================================================

      - bash: |

          echo "Installing SFDX Git Delta..."

          echo y | sf plugins install sfdx-git-delta

          echo "Installed plugins:"
          sf plugins

        displayName: 'Install SFDX Git Delta'


      # ==========================================================
      # STEP 5
      # DOWNLOAD JWT PRIVATE KEY
      #
      # Azure DevOps Library:
      #
      # Secure files
      #      |
      #      +-- server.key
      #
      # The file is downloaded to the build agent temporarily.
      # Azure DevOps deletes it after the job completes.
      # ==========================================================

      - task: DownloadSecureFile@1

        name: jwtKey

        displayName: 'Download Salesforce JWT Private Key'

        inputs:
          secureFile: 'server.key'


      # ==========================================================
      # STEP 6
      # DETERMINE TARGET ENVIRONMENT
      #
      # PR:
      #
      # System.PullRequest.TargetBranch
      #
      # Normal push:
      #
      # Build.SourceBranch
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Determining Salesforce Environment"
          echo "========================================="

          echo "Build Reason:"
          echo "$(Build.Reason)"

          echo "Source Branch:"
          echo "$(Build.SourceBranch)"

          echo "PR Target Branch:"
          echo "$(System.PullRequest.TargetBranch)"


          if [ "$(Build.Reason)" = "PullRequest" ]; then

            TARGET_BRANCH="$(System.PullRequest.TargetBranch)"

          else

            TARGET_BRANCH="$(Build.SourceBranch)"

          fi


          # Remove refs/heads/ if present
          TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"


          echo "Target Branch = $TARGET_BRANCH"


          case "$TARGET_BRANCH" in

            develop)

              echo "##vso[task.setvariable variable=ENV_NAME]DEV"

              # Actual DEV deployment
              echo "##vso[task.setvariable variable=DEPLOY_TEST_LEVEL]NoTestRun"

              # PR validation always runs tests
              echo "##vso[task.setvariable variable=PR_TEST_LEVEL]RunLocalTests"

              echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

              ;;


            SIT)

              echo "##vso[task.setvariable variable=ENV_NAME]SIT"

              echo "##vso[task.setvariable variable=DEPLOY_TEST_LEVEL]RunLocalTests"

              echo "##vso[task.setvariable variable=PR_TEST_LEVEL]RunLocalTests"

              echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

              ;;


            UAT)

              echo "##vso[task.setvariable variable=ENV_NAME]UAT"

              echo "##vso[task.setvariable variable=DEPLOY_TEST_LEVEL]RunLocalTests"

              echo "##vso[task.setvariable variable=PR_TEST_LEVEL]RunLocalTests"

              echo "##vso[task.setvariable variable=INSTANCE_URL]https://test.salesforce.com"

              ;;


            main)

              echo "##vso[task.setvariable variable=ENV_NAME]PROD"

              echo "##vso[task.setvariable variable=DEPLOY_TEST_LEVEL]RunAllTestsInOrg"

              echo "##vso[task.setvariable variable=PR_TEST_LEVEL]RunAllTestsInOrg"

              echo "##vso[task.setvariable variable=INSTANCE_URL]https://login.salesforce.com"

              ;;


            *)

              echo "ERROR: Unsupported branch."

              exit 1

              ;;

          esac


          echo "Salesforce Environment selected successfully."

        displayName: 'Determine Salesforce Environment'


      # ==========================================================
      # STEP 7
      # JWT AUTHENTICATION
      #
      # IMPORTANT:
      #
      # We are NOT using:
      #
      # sf org login sfdx-url
      #
      # Instead:
      #
      # sf org login jwt
      #
      # Credentials are selected according to the target branch.
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Salesforce JWT Authentication"
          echo "========================================="

          echo "Environment: $(ENV_NAME)"


          KEY_FILE="$(jwtKey.secureFilePath)"


          chmod 600 "$KEY_FILE"


          if [ "$(ENV_NAME)" = "DEV" ]; then

            SF_USERNAME_VALUE="$(SF_USERNAME_DEV)"
            SF_CLIENT_ID_VALUE="$(SF_CLIENT_ID_DEV)"

          elif [ "$(ENV_NAME)" = "SIT" ]; then

            SF_USERNAME_VALUE="$(SF_USERNAME_SIT)"
            SF_CLIENT_ID_VALUE="$(SF_CLIENT_ID_SIT)"

          elif [ "$(ENV_NAME)" = "UAT" ]; then

            SF_USERNAME_VALUE="$(SF_USERNAME_UAT)"
            SF_CLIENT_ID_VALUE="$(SF_CLIENT_ID_UAT)"

          elif [ "$(ENV_NAME)" = "PROD" ]; then

            SF_USERNAME_VALUE="$(SF_USERNAME_PROD)"
            SF_CLIENT_ID_VALUE="$(SF_CLIENT_ID_PROD)"

          else

            echo "Invalid Salesforce environment."

            exit 1

          fi


          echo "Authenticating to Salesforce..."

          sf org login jwt \
            --username "$SF_USERNAME_VALUE" \
            --jwt-key-file "$KEY_FILE" \
            --client-id "$SF_CLIENT_ID_VALUE" \
            --instance-url "$(INSTANCE_URL)" \
            --alias "$(SF_ALIAS)" \
            --set-default


          echo "JWT authentication successful."

        displayName: 'Authenticate Salesforce Using JWT'


      # ==========================================================
      # STEP 8
      # VERIFY SALESFORCE ORG
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Salesforce Org Information"
          echo "========================================="

          sf org display \
            --target-org "$(SF_ALIAS)"

        displayName: 'Verify Salesforce Authentication'


      # ==========================================================
      # STEP 9
      # DETERMINE DELTA RANGE
      #
      # PR:
      #
      # Compare target branch against PR HEAD.
      #
      # Example:
      #
      # origin/develop
      #       ↓
      #       ↓ compare
      #       ↓
      # HEAD
      #
      # After merge:
      #
      # HEAD~1 → HEAD
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Determining Delta Range"
          echo "========================================="


          if [ "$(Build.Reason)" = "PullRequest" ]; then

            TARGET_BRANCH="$(System.PullRequest.TargetBranch)"

            TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"


            echo "Fetching target branch..."

            git fetch origin "$TARGET_BRANCH"


            FROM_REF="origin/$TARGET_BRANCH"

            TO_REF="HEAD"


          else

            FROM_REF="HEAD~1"

            TO_REF="HEAD"

          fi


          echo "Delta FROM = $FROM_REF"

          echo "Delta TO   = $TO_REF"


          echo "##vso[task.setvariable variable=DELTA_FROM]$FROM_REF"

          echo "##vso[task.setvariable variable=DELTA_TO]$TO_REF"


        displayName: 'Determine Delta Commit Range'


      # ==========================================================
      # STEP 10
      # GENERATE DELTA PACKAGE
      #
      # SGD creates:
      #
      # delta/
      #   |
      #   +-- package/
      #   |     |
      #   |     +-- package.xml
      #   |
      #   +-- destructiveChanges/
      #         |
      #         +-- destructiveChanges.xml
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Generating Salesforce Delta"
          echo "========================================="


          rm -rf delta

          mkdir -p delta


          sf sgd source delta \
            --from "$(DELTA_FROM)" \
            --to "$(DELTA_TO)" \
            --output-dir delta \
            --source-dir force-app \
            --generate-delta


          echo ""
          echo "========================================="
          echo "Generated package.xml"
          echo "========================================="


          if [ -f "delta/package/package.xml" ]; then

            cat delta/package/package.xml

          else

            echo "No package.xml generated."

          fi


          echo ""
          echo "========================================="
          echo "Generated destructiveChanges.xml"
          echo "========================================="


          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ]; then

            cat delta/destructiveChanges/destructiveChanges.xml

          else

            echo "No destructive changes."

          fi


        displayName: 'Generate Salesforce Delta Package'


      # ==========================================================
      # STEP 11
      # PR VALIDATION
      #
      # IMPORTANT:
      #
      # This does NOT deploy.
      #
      # It validates the metadata and executes Apex tests.
      #
      # For sandbox:
      #
      #     --dry-run
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Salesforce PR Validation"
          echo "========================================="

          echo "Environment: $(ENV_NAME)"


          if [ ! -f "delta/package/package.xml" ]; then

            echo "No package.xml found."

            echo "No Salesforce metadata changes."

            exit 0

          fi


          if ! grep -q "<members>" delta/package/package.xml; then

            echo "No Salesforce metadata changes."

            exit 0

          fi


          echo ""
          echo "Running Salesforce validation..."
          echo "Test Level: $(PR_TEST_LEVEL)"
          echo ""


          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org "$(SF_ALIAS)" \
            --test-level "$(PR_TEST_LEVEL)" \
            --dry-run \
            --wait 60


          echo ""
          echo "Salesforce PR validation successful."


        displayName: 'Validate Salesforce Metadata and Run Apex Tests'

        condition: |
          and(
            succeeded(),
            eq(variables['Build.Reason'], 'PullRequest')
          )


      # ==========================================================
      # STEP 12
      # ACTUAL DEPLOYMENT
      #
      # Runs after PR merge.
      #
      # develop → DEV
      # SIT     → SIT
      # UAT     → UAT
      # main    → PROD
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Salesforce Actual Deployment"
          echo "========================================="

          echo "Environment: $(ENV_NAME)"

          echo "Test Level: $(DEPLOY_TEST_LEVEL)"


          if [ ! -f "delta/package/package.xml" ]; then

            echo "No package.xml found."

            echo "No Salesforce metadata changes."

            exit 0

          fi


          if ! grep -q "<members>" delta/package/package.xml; then

            echo "No Salesforce metadata changes."

            exit 0

          fi


          echo ""
          echo "Starting Salesforce deployment..."
          echo ""


          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org "$(SF_ALIAS)" \
            --test-level "$(DEPLOY_TEST_LEVEL)" \
            --wait 60


          echo ""
          echo "Salesforce deployment successful."


        displayName: 'Deploy Salesforce Delta'

        condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest')
          )


      # ==========================================================
      # STEP 13
      # DESTRUCTIVE CHANGES
      #
      # Example:
      #
      # Developer deletes:
      #
      # OldClass.cls
      #
      # SGD generates:
      #
      # destructiveChanges.xml
      #
      # ==========================================================

      - bash: |

          echo "========================================="
          echo "Checking Destructive Changes"
          echo "========================================="


          if [ ! -f "delta/destructiveChanges/destructiveChanges.xml" ]; then

            echo "No destructiveChanges.xml found."

            exit 0

          fi


          if ! grep -q "<types>" \
            delta/destructiveChanges/destructiveChanges.xml; then

            echo "No destructive metadata found."

            exit 0

          fi


          echo ""
          echo "Destructive changes detected:"
          echo ""


          cat delta/destructiveChanges/destructiveChanges.xml


          echo ""
          echo "Deploying destructive changes..."
          echo ""


          sf project deploy start \
            --manifest delta/package/package.xml \
            --post-destructive-changes \
              delta/destructiveChanges/destructiveChanges.xml \
            --target-org "$(SF_ALIAS)" \
            --test-level "$(DEPLOY_TEST_LEVEL)" \
            --wait 60


          echo ""
          echo "Destructive deployment successful."


        displayName: 'Deploy Destructive Changes'

        condition: |
          and(
            succeeded(),
            ne(variables['Build.Reason'], 'PullRequest')
          )